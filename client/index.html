<!doctype html>
<html lang="th">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>JaiKrajok - กระจกสะท้อนใจ</title>
    <meta name="description" content="JaiKraJok — ผู้ช่วย AI สำหรับนักเรียนไทย ช่วยตอบคำถาม วิเคราะห์การบ้าน และดูแลสุขภาพจิต" />
    <meta name="theme-color" content="#F5EFE6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=yes" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Prevent horizontal scroll on mobile */
      html, body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }

      body, button, input, textarea, select {
        font-family: 'Plus Jakarta Sans', 'Inter', 'Noto Sans Thai', 'Prompt', sans-serif;
      }

      /* Mobile-specific optimizations */
      @media (max-width: 768px) {
        body {
          -webkit-text-size-adjust: 100%;
          -webkit-font-smoothing: antialiased;
        }

        /* Prevent zoom on input focus in iOS */
        input, select, textarea {
          font-size: 16px !important;
        }
      }
      .btn-animate-chars {
        overflow: hidden;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn-animate-chars-text-wrap {
        display: inline-block;
        overflow: hidden;
        position: relative;
      }
      .btn-animate-chars-text {
        display: inline-block;
        position: relative;
        text-shadow: 0px 1.3em currentColor;
        transform: translateY(0em) rotate(0.001deg);
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-animate-chars:hover .btn-animate-chars-text {
        transform: translateY(-1.3em) rotate(0.001deg);
      }
      .button-icon-track {
        transform: translate(0, 0);
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-animate-chars:hover .button-icon-track {
        transform: translate(30%, 0);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
