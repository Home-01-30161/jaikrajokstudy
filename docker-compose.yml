name: ${TEAM}

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  networks: [app]

services:
  frontend:
    <<: *common
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_LINE_CHANNEL_ID:          "${APP_VITE_LINE_CHANNEL_ID:-}"
        VITE_GOOGLE_CLIENT_ID:         "${APP_VITE_GOOGLE_CLIENT_ID:-}"
        VITE_APP_ID:                   "${APP_VITE_APP_ID:-}"
        VITE_OAUTH_PORTAL_URL:         "${APP_VITE_OAUTH_PORTAL_URL:-}"
        VITE_PATHUMMA_API_KEY:         "${APP_VITE_PATHUMMA_API_KEY:-}"
        VITE_THAILLM_API_KEY:          "${APP_VITE_THAILLM_API_KEY:-}"
        VITE_FRONTEND_FORGE_API_URL:   "${APP_VITE_FRONTEND_FORGE_API_URL:-}"
        VITE_FRONTEND_FORGE_API_KEY:   "${APP_VITE_FRONTEND_FORGE_API_KEY:-}"
    ports:
      - "127.0.0.1:${BASE}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  api:
    <<: *common
    build: ./api
    ports:
      - "127.0.0.1:${BASE_1}:8000"
    env_file:
      - .env
    environment:
      ROOT_PATH: /api
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${TEAM:-team07}pass@db:5432/app
      THAILLM_API_KEY: "${APP_THAILLM_API_KEY:-CkAPIGzjpSP7jgLmbrlD4P8yJ9SuOb4T}"
    volumes:
      - /data/hack/${TEAM:-team07}/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${TEAM:-team07}pass
      POSTGRES_DB: app
    volumes:
      - /data/hack/${TEAM:-team07}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

networks:
  app:
    driver: bridge
