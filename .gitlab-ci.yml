# ============================================================
#  .gitlab-ci.yml — JaiKrajok (PeeMeowLab) / team07
#
#  base = 20000 + (7 - 1) * 10
#     team07 -> BASE 20060  BASE_1 20061
# ============================================================

variables:
  TEAM:   "team07"
  BASE:   "20060"
  BASE_1: "20061"

stages: [check, deploy, ops]

default:
  image: docker:27.3.1
  before_script:
    - docker compose version >/dev/null 2>&1 || apk add --no-cache docker-cli-compose
    - apk add --no-cache curl bash >/dev/null
    - echo "TEAM=$TEAM  fe=$BASE  api=$BASE_1"
    # How this job reaches the Docker daemon. If DOCKER_HOST points at
    # tcp://docker:2375 but no dind service exists, every docker command fails
    # with "lookup docker ... no such host". Prefer the mounted host socket.
    - |
      echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
      if [ -S /var/run/docker.sock ]; then
        echo "host socket: present -> using it"
        unset DOCKER_HOST
        export DOCKER_HOST=unix:///var/run/docker.sock
      else
        echo "host socket: ABSENT"
      fi
      docker info --format 'daemon ok: {{.ServerVersion}}' 2>&1 | head -3 || true

# ------------------------------------------------------------
#  Validate compose against hackathon rules
# ------------------------------------------------------------
check:
  stage: check
  script:
    - |
      LO=$BASE; HI=$((BASE+9)); FAIL=0

      echo "== port binding =="
      while read -r line; do
        case "$line" in
          *'${BASE'*|*'$BASE'*) echo "  ok (variable) $line" ;;
          *127.0.0.1:*)
            p=$(echo "$line" | sed -n 's/.*127\.0\.0\.1:\([0-9]\+\):.*/\1/p')
            if [ -n "$p" ] && { [ "$p" -lt "$LO" ] || [ "$p" -gt "$HI" ]; }; then
              echo "  FAIL port $p outside $TEAM range ($LO-$HI)"; FAIL=1
            else echo "  ok $line"; fi ;;
          *) echo "  FAIL not bound to 127.0.0.1 -> $line"; FAIL=1 ;;
        esac
      done < <(grep -E '^\s*-\s*"?[0-9.$][^:]*:[0-9$]' docker-compose.yml || true)

      echo "== bind mount =="
      for m in $(grep -oE '^\s*-\s*[./][^:]*:' docker-compose.yml | sed 's/^\s*-\s*//; s/:$//' || true); do
        case "$m" in
          */var/run/docker.sock*) echo "  FAIL docker.sock not allowed"; FAIL=1 ;;
          ./*|../*) echo "  FAIL relative bind mount: $m"; FAIL=1 ;;
          /data/hack/*) echo "  ok $m" ;;
          /*) echo "  FAIL bind mount outside /data/hack: $m"; FAIL=1 ;;
        esac
      done

      echo "== other =="
      grep -q 'memory:'      docker-compose.yml || { echo "  FAIL no memory limit"; FAIL=1; }
      grep -q 'healthcheck:' docker-compose.yml || { echo "  FAIL api needs healthcheck"; FAIL=1; }
      grep -q 'max-size'     docker-compose.yml || { echo "  FAIL no logging max-size"; FAIL=1; }

      [ $FAIL -eq 0 ] && echo "all checks passed" || { echo "fix the FAIL lines above"; exit 1; }

# ------------------------------------------------------------
#  Deploy (main only)
# ------------------------------------------------------------
deploy:
  stage: deploy
  timeout: 20m
  interruptible: true
  environment:
    name: $TEAM
    url: https://$TEAM.aiforthai.in.th
  script:
    # secrets come from CI/CD Variables prefixed with APP_ (set them Masked)
    - printenv | grep '^APP_' > .env || true
    - docker compose -p "$TEAM" up -d --build --remove-orphans
    - |
      echo "waiting for healthcheck..."
      # resolve the container id from compose instead of guessing the name
      CID=$(docker compose -p "$TEAM" ps -q api)
      echo "api container: $CID"
      st=none
      for i in $(seq 1 40); do
        st=$(docker inspect -f '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo none)
        [ "$st" = "healthy" ] && { echo "api healthy"; break; }
        echo "  [$i/40] status=$st"
        sleep 5
      done
      docker compose -p "$TEAM" ps
      if [ "$st" != "healthy" ]; then
        echo "api never became healthy - last 200 log lines:"
        docker compose -p "$TEAM" logs --tail=200 --no-color api
        exit 1
      fi
    - |
      # The job runs in its own container, so the host loopback where compose
      # published ${BASE_1} is not reachable from here. Verify /health from
      # inside the api container instead.
      docker compose -p "$TEAM" exec -T api curl -fsS http://localhost:8000/health \
        && echo " <- /health OK"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
#  Manual ops jobs (used instead of SSH)
# ============================================================
.ops: &ops
  stage: ops
  when: manual
  allow_failure: true
  interruptible: false

logs:
  <<: *ops
  script: [docker compose -p "$TEAM" logs --tail=400 --timestamps --no-color]

ps:
  <<: *ops
  script:
    - docker compose -p "$TEAM" ps
    - docker stats --no-stream $(docker compose -p "$TEAM" ps -q) || true

restart:
  <<: *ops
  script:
    - docker compose -p "$TEAM" restart
    - docker compose -p "$TEAM" ps

smoke-ai:
  <<: *ops
  # allow_failure stays true (inherited) so a flaky upstream API never blocks
  # ops, but the script now exits non-zero on failure so the job badge is honest.
  script:
    - docker compose -p "$TEAM" exec -T api python scripts/test_aiforthai_apis.py

shell-cmd:
  <<: *ops
  variables:
    SERVICE: api
    CMD: "python -c 'import sys; print(sys.version)'"
  script: [docker compose -p "$TEAM" exec -T "$SERVICE" sh -lc "$CMD"]
