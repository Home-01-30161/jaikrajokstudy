# ============================================================
#  .gitlab-ci.yml — JaiKrajok / team07
#
#  base = 20000 + (7 - 1) * 10
#     team07 -> BASE 20060  BASE_1 20061
#
#  Runner config.toml permanently injects DOCKER_HOST=tcp://docker:2375
#  into every job. We cannot override it. The ONLY fix is to start a
#  dind daemon that actually listens at that address.
#
#  Required trio (standard GitLab dind without TLS):
#    image: docker:27.3.1          — provides the docker CLI
#    services: docker:27.3.1-dind  — starts the daemon at tcp://docker:2375
#    DOCKER_TLS_CERTDIR: ""        — disables TLS so daemon uses port 2375
#
#  before_script waits with `docker info` until dind is ready before any
#  build step runs — without this the build starts before the daemon is up.
# ============================================================

variables:
  TEAM:   "team07"
  BASE:   "20060"
  BASE_1: "20061"
  DOCKER_TLS_CERTDIR: ""

stages: [check, deploy, ops]

default:
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      alias: docker
  before_script:
    - until docker info > /dev/null 2>&1; do echo "waiting for docker daemon..."; sleep 2; done
    - docker compose version > /dev/null 2>&1 || apk add --no-cache docker-cli-compose
    - apk add --no-cache curl bash > /dev/null
    - echo "TEAM=$TEAM  fe=$BASE  api=$BASE_1"

# ------------------------------------------------------------
#  ตรวจ compose ก่อน deploy
# ------------------------------------------------------------
check:
  stage: check
  script:
    - |
      LO=$BASE; HI=$((BASE+9)); FAIL=0

      echo "== port binding =="
      while read -r line; do
        case "$line" in
          *'${BASE'*|*'$BASE'*) echo "  ok (variable) $line" ;;
          *127.0.0.1:*)
            p=$(echo "$line" | sed -n 's/.*127\.0\.0\.1:\([0-9]\+\):.*/\1/p')
            if [ -n "$p" ] && { [ "$p" -lt "$LO" ] || [ "$p" -gt "$HI" ]; }; then
              echo "  FAIL port $p outside $TEAM range ($LO-$HI)"; FAIL=1
            else echo "  ok $line"; fi ;;
          *) echo "  FAIL not bound to 127.0.0.1 -> $line"; FAIL=1 ;;
        esac
      done < <(grep -E '^\s*-\s*"?[0-9.$][^:]*:[0-9$]' docker-compose.yml || true)

      echo "== bind mount =="
      for m in $(grep -oE '^\s*-\s*[./][^:]*:' docker-compose.yml | sed 's/^\s*-\s*//; s/:$//' || true); do
        case "$m" in
          */var/run/docker.sock*) echo "  FAIL docker.sock not allowed"; FAIL=1 ;;
          ./*|../*) echo "  FAIL relative bind mount: $m"; FAIL=1 ;;
          /data/hack/*) echo "  ok $m" ;;
          /*) echo "  FAIL bind mount outside /data/hack: $m"; FAIL=1 ;;
        esac
      done

      echo "== other =="
      grep -q 'memory:'      docker-compose.yml || { echo "  FAIL no memory limit"; FAIL=1; }
      grep -q 'healthcheck:' docker-compose.yml || { echo "  FAIL api needs healthcheck"; FAIL=1; }
      grep -q 'max-size'     docker-compose.yml || { echo "  FAIL no logging max-size"; FAIL=1; }

      [ $FAIL -eq 0 ] && echo "all checks passed" || { echo "fix the FAIL lines above"; exit 1; }

# ------------------------------------------------------------
#  Deploy (main only)
# ------------------------------------------------------------
deploy:
  stage: deploy
  timeout: 20m
  interruptible: true
  environment:
    name: $TEAM
    url: https://$TEAM.aiforthai.in.th
  script:
    - printenv | grep '^APP_' > .env || true
    - docker compose -p "$TEAM" up -d --build --remove-orphans
    - |
      echo "waiting for api healthcheck..."
      for i in $(seq 1 40); do
        st=$(docker inspect -f '{{.State.Health.Status}}' "${TEAM}-api-1" 2>/dev/null || echo none)
        [ "$st" = "healthy" ] && { echo "api healthy"; break; }
        echo "  [$i/40] status=$st"
        sleep 5
      done
      docker compose -p "$TEAM" ps
      if [ "$st" != "healthy" ]; then
        echo "api never became healthy - last 200 log lines:"
        docker compose -p "$TEAM" logs --tail=200 --no-color api
        exit 1
      fi
    - curl -fsS "http://127.0.0.1:${BASE_1}/health" && echo " <- /health OK"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
#  Manual ops jobs (แทน SSH)
# ============================================================
.ops: &ops
  stage: ops
  when: manual
  allow_failure: true
  interruptible: false

logs:
  <<: *ops
  script: [docker compose -p "$TEAM" logs --tail=400 --timestamps --no-color]

ps:
  <<: *ops
  script:
    - docker compose -p "$TEAM" ps
    - docker stats --no-stream $(docker compose -p "$TEAM" ps -q) || true

restart:
  <<: *ops
  script:
    - docker compose -p "$TEAM" restart
    - docker compose -p "$TEAM" ps

migrate:
  <<: *ops
  script: [docker compose -p "$TEAM" exec -T api alembic upgrade head]

shell-cmd:
  <<: *ops
  variables:
    SERVICE: api
    CMD: "python -c 'import sys; print(sys.version)'"
  script: [docker compose -p "$TEAM" exec -T "$SERVICE" sh -lc "$CMD"]

reset-db:
  <<: *ops
  script:
    - docker compose -p "$TEAM" stop db
    - docker compose -p "$TEAM" rm -f db
    - rm -rf /data/hack/$TEAM/pgdata/*
    - docker compose -p "$TEAM" up -d
