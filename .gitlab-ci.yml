# ============================================================
#  .gitlab-ci.yml — Vercel Deployment & Automated Smoke Testing
# ============================================================

stages:
  - check
  - deploy-preview
  - smoke-test
  - deploy-production

variables:
  VERCEL_ORG_ID: $VERCEL_ORG_ID
  VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID

# ------------------------------------------------------------
#  1. Code Check Stage
# ------------------------------------------------------------
check:
  stage: check
  image: node:20-alpine
  script:
    - npm install -g pnpm
    - pnpm install --no-frozen-lockfile
    - pnpm check || true

# ------------------------------------------------------------
#  2. Deploy Preview (Feature Branches / Merge Requests)
# ------------------------------------------------------------
deploy_preview:
  stage: deploy-preview
  image: node:20-alpine
  before_script:
    - npm install -g vercel
  script:
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - DEPLOYED_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
    - echo "DEPLOYED_URL=$DEPLOYED_URL" > preview.env
    - echo "Preview URL is $DEPLOYED_URL"
  artifacts:
    reports:
      dotenv: preview.env
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

# ------------------------------------------------------------
#  3. Smoke Test Preview URL
# ------------------------------------------------------------
smoke_test_preview:
  stage: smoke-test
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "== Smoke Testing Preview URL: $DEPLOYED_URL =="
    - curl -fsS "$DEPLOYED_URL" > /dev/null && echo "✅ Homepage responds 200 OK"
    - curl -I "$DEPLOYED_URL" | grep -i "X-Frame-Options" && echo "✅ Security headers present"
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

# ------------------------------------------------------------
#  4. Deploy Production (Main Branch)
# ------------------------------------------------------------
deploy_production:
  stage: deploy-production
  image: node:20-alpine
  before_script:
    - npm install -g vercel
  script:
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - DEPLOYED_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
    - echo "Production URL is $DEPLOYED_URL"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ------------------------------------------------------------
#  5. Smoke Test Production URL (jaikrajokstudy.vercel.app)
# ------------------------------------------------------------
smoke_test_production:
  stage: deploy-production
  image: alpine:latest
  needs: [deploy_production]
  before_script:
    - apk add --no-cache curl
  script:
    - echo "== Smoke Testing Production URL =="
    - curl -fsS "https://jaikrajokstudy.vercel.app" > /dev/null && echo "✅ Production 200 OK (jaikrajokstudy.vercel.app)"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
