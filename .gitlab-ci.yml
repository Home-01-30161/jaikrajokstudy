# ============================================================
#  .gitlab-ci.yml — team07
#  base = 20000 + (7-1)*10 = 20060
#
#  The runner is a shell executor on team07.aiforthai.in.th.
#  Docker is available directly on the host — no DinD, no SSH needed.
# ============================================================

variables:
  TEAM:   "team07"
  BASE:   "20060"
  BASE_1: "20061"
  # Point the Docker CLI at the host socket mounted by the runner (no DinD)
  DOCKER_HOST: "unix:///var/run/docker.sock"

# Required by the hackathon runner (Docker executor).
# docker:27.3.1 provides the Docker CLI; DOCKER_HOST above routes it to the host daemon.
default:
  image: docker:27.3.1
  before_script:
    - docker compose version >/dev/null 2>&1 || apk add --no-cache docker-cli-compose
    - apk add --no-cache curl bash >/dev/null
    - echo "TEAM=$TEAM  fe=$BASE  api=$BASE_1"

stages: [check, deploy, smoke, ops]

# ------------------------------------------------------------
#  Validate docker-compose.yml before deploy
# ------------------------------------------------------------
check:
  stage: check
  script:
    - |
      LO=$BASE; HI=$((BASE+9)); FAIL=0

      echo "== port binding =="
      while read -r line; do
        case "$line" in
          *'${BASE'*|*'$BASE'*) echo "  ok (var) $line" ;;
          *127.0.0.1:*)
            p=$(echo "$line" | sed -n 's/.*127\.0\.0\.1:\([0-9]\+\):.*/\1/p')
            if [ -n "$p" ] && { [ "$p" -lt "$LO" ] || [ "$p" -gt "$HI" ]; }; then
              echo "  ❌ port $p outside $TEAM range ($LO-$HI)"; FAIL=1
            else echo "  ok $line"; fi ;;
          *) echo "  ❌ not bound to 127.0.0.1 -> $line"; FAIL=1 ;;
        esac
      done < <(grep -E '^\s*-\s*"?[0-9.$][^:]*:[0-9$]' docker-compose.yml || true)

      echo "== bind mounts =="
      for m in $(grep -oE '^\s*-\s*[./][^:]*:' docker-compose.yml | sed 's/^\s*-\s*//; s/:$//' || true); do
        case "$m" in
          */var/run/docker.sock*) echo "  ❌ docker.sock mount forbidden"; FAIL=1 ;;
          ./*|../*) echo "  ❌ relative bind mount: $m"; FAIL=1 ;;
          /data/hack/*) echo "  ok $m" ;;
          /*) echo "  ❌ bind mount outside /data/hack: $m"; FAIL=1 ;;
        esac
      done

      echo "== other checks =="
      grep -q 'memory:'      docker-compose.yml || { echo "  ❌ no memory limit"; FAIL=1; }
      grep -q 'healthcheck:' docker-compose.yml || { echo "  ❌ api needs healthcheck"; FAIL=1; }
      grep -q 'max-size'     docker-compose.yml || { echo "  ❌ no logging max-size"; FAIL=1; }

      [ $FAIL -eq 0 ] && echo "All checks passed" || { echo "Fix errors above"; exit 1; }

# ------------------------------------------------------------
#  Deploy — shell executor runs directly on the host
# ------------------------------------------------------------
deploy:
  stage: deploy
  timeout: 20m
  interruptible: true
  environment:
    name: $TEAM
    url: https://$TEAM.aiforthai.in.th
  script:
    - export DOCKER_HOST=unix:///var/run/docker.sock
    - printenv | grep '^APP_' > .env || true
    - docker compose -p "$TEAM" up -d --build --remove-orphans
    - |
      echo "Waiting for healthcheck..."
      for i in $(seq 1 40); do
        st=$(docker inspect -f '{{.State.Health.Status}}' "${TEAM}-api-1" 2>/dev/null || echo none)
        [ "$st" = "healthy" ] && { echo "api healthy ✓"; break; }
        sleep 5
      done
      docker compose -p "$TEAM" ps
    - docker compose -p "$TEAM" exec -T api curl -fsS http://localhost:8000/health && echo " <- /health OK"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ------------------------------------------------------------
#  Smoke test — runs automatically after deploy on main
#  Tests every AI model the project uses.
#  typhoon-ocr uses a 64×64 PNG generated via Node.js inside the api container;
#  ptm-asr-1 uses a 1-second silent WAV (16kHz mono PCM).
# ------------------------------------------------------------
smoke-test:
  stage: smoke
  needs: [deploy]
  script:
    - export DOCKER_HOST=unix:///var/run/docker.sock
    - |
      # Docker daemon may be transiently busy right after deploy finishes.
      # Wait up to 30s before running any exec commands.
      for i in $(seq 1 6); do
        docker info >/dev/null 2>&1 && break
        echo "waiting for Docker daemon… (${i}/6)"; sleep 5
      done

      FAIL=0
      ok()  { echo "  ✅ $1"; }
      fail(){ echo "  ❌ $1 — $2"; FAIL=1; }
      api() { docker compose -p "$TEAM" exec -T api "$@"; }

      echo "── /health ──────────────────────────────────────────"
      api curl -sf http://localhost:8000/health >/dev/null \
        && ok "health" || fail "health" "unreachable"

      echo "── thaillm-8b (primary text LLM) ────────────────────"
      r=$(api curl -sf -X POST http://localhost:8000/thaillm/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{"model":"thaillm-8b","messages":[{"role":"user","content":"ตอบว่า ok"}],"max_tokens":8,"stream":false}' \
        || echo "CURL_FAIL")
      echo "$r" | grep -q '"choices"' \
        && ok "thaillm-8b" || fail "thaillm-8b" "$(echo $r | cut -c1-200)"

      echo "── typhoon-v2.5-30b-a3b-instruct (text fallback) ────"
      r=$(api curl -sf -X POST http://localhost:8000/typhoon/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{"model":"typhoon-v2.5-30b-a3b-instruct","messages":[{"role":"user","content":"say ok"}],"max_tokens":8}' \
        || echo "CURL_FAIL")
      echo "$r" | grep -q '"choices"' \
        && ok "typhoon-text" || fail "typhoon-text" "$(echo $r | cut -c1-200)"

      echo "── ssense (sentiment analysis) ──────────────────────"
      api curl -sf -X POST http://localhost:8000/ssense \
        -H "Content-Type: application/json" \
        -d '{"text":"วันนี้ดีใจมาก"}' >/dev/null \
        && ok "ssense" || fail "ssense" "HTTP error"

      echo "── gemini (proxy) ───────────────────────────────────"
      r=$(api curl -s -X POST http://localhost:8000/gemini/v1beta/models/gemini-2.0-flash:generateContent \
        -H "Content-Type: application/json" \
        -d '{"contents":[{"parts":[{"text":"say hi"}]}]}' \
        || echo "CURL_FAIL")
      echo "$r" | grep -q '"candidates"' \
        && ok "gemini" || fail "gemini" "$(echo $r | cut -c1-200)"

      echo "── typhoon-ocr (vision/OCR) — 64×64 white PNG ───────"
      # Generate a 64×64 white PNG inside the api container with Node.js.
      # 1×1 pixel causes "An error occurred during model processing".
      r=$(api sh -c '
        node -e "const z=require(\"zlib\"),W=64,H=64,tbl=new Uint32Array(256);for(let i=0;i<256;i++){let v=i;for(let j=0;j<8;j++)v=v&1?(v>>>1)^0xedb88320:v>>>1;tbl[i]=v}const crc=b=>{let r=-1;for(const x of b)r=(r>>>8)^tbl[(r^x)&255];return(r^-1)>>>0};const ck=(t,d)=>{const tb=Buffer.from(t),l=Buffer.alloc(4);l.writeUInt32BE(d.length);const cc=Buffer.concat([tb,d]),cb=Buffer.alloc(4);cb.writeUInt32BE(crc(cc));return Buffer.concat([l,tb,d,cb])};const h=Buffer.alloc(13);h.writeUInt32BE(W,0);h.writeUInt32BE(H,4);h[8]=8;h[9]=0;const rows=[];for(let y=0;y<H;y++){const r=Buffer.alloc(W+1,255);r[0]=0;rows.push(r)};require(\"fs\").writeFileSync(\"/tmp/s.png\",Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]),ck(\"IHDR\",h),ck(\"IDAT\",z.deflateSync(Buffer.concat(rows))),ck(\"IEND\",Buffer.alloc(0))]))"
        B64=$(base64 /tmp/s.png | tr -d "\n")
        curl -s --max-time 90 -X POST http://localhost:8000/typhoon/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"typhoon-ocr\",\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"image_url\",\"image_url\":{\"url\":\"data:image/png;base64,$B64\"}},{\"type\":\"text\",\"text\":\"what text is in this image?\"}]}],\"max_tokens\":16}"
        rm -f /tmp/s.png
      ' || echo "CURL_FAIL")
      echo "$r" | grep -q '"choices"' \
        && ok "typhoon-ocr" || fail "typhoon-ocr" "$(echo $r | cut -c1-200)"

      echo "── ptm-asr-1 (speech-to-text) — silent WAV ──────────"
      # BusyBox mktemp does not support filename suffixes; MIME type set via -F.
      # Build a valid 16kHz mono 16-bit PCM WAV inside the api container.
      r=$(api sh -c \
        'W=$(mktemp /tmp/smoke-asr-XXXXXX)
         printf "\122\111\106\106\044\175\000\000\127\101\126\105\146\155\164\040\020\000\000\000\001\000\001\000\200\076\000\000\000\175\000\000\002\000\020\000\144\141\164\141\000\175\000\000" > "$W"
         dd if=/dev/zero bs=32000 count=1 >> "$W" 2>/dev/null
         curl -s --max-time 90 -X POST http://localhost:8000/ptm-asr/audio/transcriptions \
           -F "file=@${W};type=audio/wav" -F "model=ptm-asr-1"
         rm -f "$W"' \
        || echo "CURL_FAIL")
      # Accept any response containing "text" (transcription, even empty "")
      echo "$r" | grep -qE '"text"' \
        && ok "ptm-asr-1" || fail "ptm-asr-1" "$(echo $r | cut -c1-200)"

      echo ""
      [ $FAIL -eq 0 ] \
        && echo "✅  All smoke tests passed" \
        || { echo "❌  One or more smoke tests FAILED — see above"; exit 1; }
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
#  Manual ops jobs
# ============================================================
.ops: &ops
  stage: ops
  when: manual
  allow_failure: true
  interruptible: false

logs:
  <<: *ops
  script: [docker compose -p "$TEAM" logs --tail=400 --timestamps --no-color]

ps:
  <<: *ops
  script:
    - docker compose -p "$TEAM" ps
    - docker stats --no-stream $(docker compose -p "$TEAM" ps -q) || true

restart:
  <<: *ops
  script:
    - docker compose -p "$TEAM" restart
    - docker compose -p "$TEAM" ps

migrate:
  <<: *ops
  script: [docker compose -p "$TEAM" exec -T api alembic upgrade head]

shell-cmd:
  <<: *ops
  variables:
    SERVICE: api
    CMD: "node -e 'console.log(process.version)'"
  script: [docker compose -p "$TEAM" exec -T "$SERVICE" sh -lc "$CMD"]

reset-db:
  <<: *ops
  script:
    - docker compose -p "$TEAM" stop db
    - docker compose -p "$TEAM" rm -f db
    - rm -rf /data/hack/$TEAM/pgdata/*
    - docker compose -p "$TEAM" up -d
