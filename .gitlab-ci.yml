# ============================================================
#  .gitlab-ci.yml — team07
#  base = 20000 + (7-1)*10 = 20060
#
#  Deploy via SSH to the deployment host (team07.aiforthai.in.th).
#  The CI runner has no privileged mode so Docker-in-Docker cannot start.
#  Required CI/CD variables (Settings → CI/CD → Variables):
#    SSH_PRIVATE_KEY  — private key whose public key is in ~/.ssh/authorized_keys on host
#    DEPLOY_USER      — SSH username on the host (e.g. ubuntu or team07)
# ============================================================

variables:
  TEAM:        "team07"
  BASE:        "20060"
  BASE_1:      "20061"
  DEPLOY_HOST: "team07.aiforthai.in.th"
  GIT_DEPTH:   "1"

stages: [check, deploy, ops]

# Shared SSH setup used by deploy + ops jobs
.ssh_setup: &ssh_setup
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - ssh-add /tmp/deploy_key || { echo "ssh-add failed — check SSH_PRIVATE_KEY in CI/CD Variables"; exit 1; }
    - rm -f /tmp/deploy_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
    - echo "SSH ready → $DEPLOY_USER@$DEPLOY_HOST"

# ------------------------------------------------------------
#  Validate docker-compose.yml (no Docker daemon needed)
# ------------------------------------------------------------
check:
  stage: check
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash grep sed
  script:
    - |
      LO=$BASE; HI=$((BASE+9)); FAIL=0

      echo "== port binding =="
      while read -r line; do
        case "$line" in
          *'${BASE'*|*'$BASE'*) echo "  ok (var) $line" ;;
          *127.0.0.1:*)
            p=$(echo "$line" | sed -n 's/.*127\.0\.0\.1:\([0-9]\+\):.*/\1/p')
            if [ -n "$p" ] && { [ "$p" -lt "$LO" ] || [ "$p" -gt "$HI" ]; }; then
              echo "  ❌ port $p outside $TEAM range ($LO-$HI)"; FAIL=1
            else echo "  ok $line"; fi ;;
          *) echo "  ❌ not bound to 127.0.0.1 -> $line"; FAIL=1 ;;
        esac
      done < <(grep -E '^\s*-\s*"?[0-9.$][^:]*:[0-9$]' docker-compose.yml || true)

      echo "== bind mounts =="
      for m in $(grep -oE '^\s*-\s*[./][^:]*:' docker-compose.yml | sed 's/^\s*-\s*//; s/:$//' || true); do
        case "$m" in
          */var/run/docker.sock*) echo "  ❌ docker.sock mount forbidden"; FAIL=1 ;;
          ./*|../*) echo "  ❌ relative bind mount: $m"; FAIL=1 ;;
          /data/hack/*) echo "  ok $m" ;;
          /*) echo "  ❌ bind mount outside /data/hack: $m"; FAIL=1 ;;
        esac
      done

      echo "== other checks =="
      grep -q 'memory:'      docker-compose.yml || { echo "  ❌ no memory limit"; FAIL=1; }
      grep -q 'healthcheck:' docker-compose.yml || { echo "  ❌ api needs healthcheck"; FAIL=1; }
      grep -q 'max-size'     docker-compose.yml || { echo "  ❌ no logging max-size"; FAIL=1; }

      [ $FAIL -eq 0 ] && echo "All checks passed" || { echo "Fix errors above"; exit 1; }

# ------------------------------------------------------------
#  Deploy — SSH to host, git pull, docker compose up --build
# ------------------------------------------------------------
deploy:
  <<: *ssh_setup
  stage: deploy
  timeout: 20m
  interruptible: true
  environment:
    name: $TEAM
    url: https://$TEAM.aiforthai.in.th
  script:
    - |
      # Build .env from APP_* CI variables and send to host
      printenv | grep '^APP_' > /tmp/deploy.env || true
      scp /tmp/deploy.env "$DEPLOY_USER@$DEPLOY_HOST:/data/hack/$TEAM/.env"

      ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -c '
        set -e
        cd /data/hack/team07
        git pull origin main
        docker compose -p team07 up -d --build --remove-orphans

        echo "Waiting for healthcheck..."
        for i in $(seq 1 40); do
          st=$(docker inspect -f '"'"'{{.State.Health.Status}}'"'"' "team07-api-1" 2>/dev/null || echo none)
          [ "$st" = "healthy" ] && { echo "api healthy"; break; }
          sleep 5
        done

        docker compose -p team07 ps
        docker compose -p team07 exec -T api curl -fsS http://localhost:8000/health && echo " <- /health OK"
      '
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
#  Manual ops jobs — all run via SSH on the host
# ============================================================
.ops: &ops
  <<: *ssh_setup
  stage: ops
  when: manual
  allow_failure: true
  interruptible: false

logs:
  <<: *ops
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" docker compose -p team07 logs --tail=400 --timestamps --no-color

ps:
  <<: *ops
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" docker compose -p team07 ps
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -c \
        'docker stats --no-stream $(docker compose -p team07 ps -q) || true'

restart:
  <<: *ops
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" docker compose -p team07 restart
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" docker compose -p team07 ps

shell-cmd:
  <<: *ops
  variables:
    SERVICE: api
    CMD: "node -e 'console.log(process.version)'"
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" docker compose -p team07 exec -T "$SERVICE" sh -lc "$CMD"
