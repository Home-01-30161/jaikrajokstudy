providers:
  - id: openai:chat:pathumma-thaillm-qwen3-8b-think-3.0.0
    config:
      apiBaseUrl: http://thaillm.or.th/api/v1
      apiKey: ${THAILLM_API_KEY}

prompts:
  - "{{question}}"

tests:
  - vars:
      question: "1+1 เท่ากับเท่าไหร่?"
    assert:
      - type: contains
        value: "2"

  - vars:
      question: "ประเทศไทยเมืองหลวงคือที่ไหน?"
    assert:
      - type: contains
        value: "กรุงเทพ"

  - vars:
      question: "สวัสดีตอบกลับมาด้วยภาษาไทย"
    assert:
      - type: regex
        value: "[฀-๿]"

  - vars:
      question: "อธิบายการทำงานของ AI ในหนึ่งประโยค"
    assert:
      - type: javascript
        value: "output.length > 10"
